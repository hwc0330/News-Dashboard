<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>배터리/전기차 헤드라인</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --accent: #1a56c4; --chip: #eef2f8; --chip-on: #1a56c4; --chip-on-text: #fff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --line: #2a313d;
      --accent: #7aa7ff; --chip: #252c38; --chip-on: #7aa7ff; --chip-on-text: #0d1117;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  .updated { color: var(--muted); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  select, input[type=search] { font: inherit; padding: 7px 10px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--card); color: var(--text); }
  input[type=search] { flex: 1; min-width: 180px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .chip { border: 0; border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px;
          background: var(--chip); color: var(--text); cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--chip-on); color: var(--chip-on-text); }
  .chip .n { opacity: .7; margin-left: 4px; }
  section.sec { margin-bottom: 26px; }
  section.sec > h2 { font-size: 17px; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--text); }
  section.sec > h2 .n { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
  details.grp { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
                margin-bottom: 10px; overflow: hidden; }
  details.grp > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; }
  details.grp > summary::-webkit-details-marker { display: none; }
  details.grp > summary::before { content: "▸ "; color: var(--muted); }
  details.grp[open] > summary::before { content: "▾ "; }
  details.grp > summary .n { color: var(--muted); font-weight: 400; margin-left: 4px; }
  ul { list-style: none; margin: 0; padding: 0 14px 6px; }
  li { padding: 8px 0; border-top: 1px solid var(--line); }
  li a { color: var(--text); text-decoration: none; }
  li a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .orig { color: var(--muted); font-size: 12.5px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>배터리/전기차 헤드라인</h1>
    <span class="updated" id="updated"></span>
  </header>
  <div class="controls">
    <select id="date" aria-label="날짜"></select>
    <input type="search" id="q" placeholder="제목·매체 검색" aria-label="검색">
  </div>
  <div class="chips" id="chips"></div>
  <main id="list"><p class="empty">불러오는 중…</p></main>
</div>
<script>
const $ = s => document.querySelector(s);
let meta, items = [], activeTag = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hhmm = iso => { const d = new Date(iso); return isNaN(d) ? "" :
  d.toLocaleString("ko-KR", {timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false}); };

async function init() {
  meta = await (await fetch("data/index.json", {cache: "no-store"})).json();
  $("#updated").textContent = "업데이트 " + hhmm(meta.updated);
  $("#date").innerHTML = meta.dates.map(d => `<option value="${d}">${d}</option>`).join("");
  $("#date").onchange = () => load($("#date").value);
  $("#q").oninput = render;
  if (meta.dates.length) load(meta.dates[0]); else $("#list").innerHTML = '<p class="empty">아직 데이터가 없습니다.</p>';
}

async function load(date) {
  items = await (await fetch(`data/${date}.json`, {cache: "no-store"})).json();
  items.sort((a, b) => b.published.localeCompare(a.published));
  render();
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const hit = it => !q || (it.title + " " + it.original + " " + it.source).toLowerCase().includes(q);
  const base = items.filter(hit);

  const counts = {};
  base.forEach(it => counts[it.tag] = (counts[it.tag] || 0) + 1);
  const tags = meta.tags.filter(t => counts[t]);
  $("#chips").innerHTML = [`<button class="chip" data-tag="" aria-pressed="${!activeTag}">전체<span class="n">${base.length}</span></button>`]
    .concat(tags.map(t => `<button class="chip" data-tag="${esc(t)}" aria-pressed="${activeTag === t}">${esc(t)}<span class="n">${counts[t]}</span></button>`)).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { activeTag = b.dataset.tag || null; render(); });

  const shown = base.filter(it => !activeTag || it.tag === activeTag);
  if (!shown.length) { $("#list").innerHTML = '<p class="empty">해당하는 기사가 없습니다.</p>'; return; }

  $("#list").innerHTML = meta.sections.map(sec => {
    const inSec = shown.filter(it => it.section === sec);
    if (!inSec.length) return "";
    const groups = meta.tags.map(tag => {
      const g = inSec.filter(it => it.tag === tag);
      if (!g.length) return "";
      return `<details class="grp" ${sec === "기타" ? "" : "open"}><summary>(${esc(tag)})<span class="n">${g.length}</span></summary><ul>` +
        g.map(it => `<li><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>` +
          (it.original ? `<div class="orig">${esc(it.original)}</div>` : "") +
          `<div class="meta">${esc(it.source)} · ${hhmm(it.published)}</div></li>`).join("") + "</ul></details>";
    }).join("");
    return `<section class="sec"><h2>■ ${esc(sec)}<span class="n">${inSec.length}건</span></h2>${groups}</section>`;
  }).join("");
}

init().catch(e => { $("#list").innerHTML = `<p class="empty">불러오지 못했습니다: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
